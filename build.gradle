buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {
            url = uri("https://maven.aliyun.com/repository/public/")
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77'
        classpath 'org.parchmentmc:librarian:1.2.0.7-dev-SNAPSHOT'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

group = mod_group_id
version = mod_version
archivesBaseName = 'tacz-vr'

def includeVivecraftRuntime = (findProperty('include_vivecraft_runtime') ?: 'true').toBoolean()

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, 'taczvr.refmap.json'
    config 'taczvr.mixins.json'
}

minecraft {
    mappings channel: 'parchment', version: parchment_version

    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                taczvr {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                taczvr {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url = uri("https://maven.aliyun.com/repository/public/")
    }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    compileOnly fg.deobf("maven.modrinth:vivecraft:${vivecraft_version}")
    if (includeVivecraftRuntime) {
        runtimeOnly fg.deobf("maven.modrinth:vivecraft:${vivecraft_version}")
    }
    implementation fg.deobf("maven.modrinth:${tacz_modrinth_project}:${tacz_modrinth_version}")
    // TACZ 1.1.8 supplies the Forge runtime through JarJar; compile only against its common annotation/API classes.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.6'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

def replaceProperties = [
        minecraft_version: minecraft_version,
        forge_version    : forge_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_version      : mod_version,
        tacz_version     : tacz_version,
        vivecraft_version: vivecraft_version,
        vivecraft_mod_version: vivecraft_mod_version,
        mod_license      : mod_license,
        mod_authors      : mod_authors,
        mod_description  : mod_description
]

processResources {
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

jar {
    from('LICENSE')
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'taczvr.mixins.json'
        ])
    }
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

apply from: 'gradle/verification.gradle'
